    { id:"t1l1", title:"La Leche Materna como Patrón de Referencia", duration:"9 min", content:`
## El Estándar de Oro Nutricional

La leche materna es el patrón de referencia adaptado al crecimiento y desarrollo del lactante. Su composición **no es constante**: varía a lo largo de la lactancia, dentro de una misma toma y según la hora del día.

### Fases de la Leche Materna

| Fase | Días | Características |
|---|---|---|
| Calostro | 1–5 | Alta IgA, electrolitos elevados, menos kcal, laxante |
| Transición | 6–14 | Aumenta lactosa y grasa, baja proteína |
| Madura | &gt;15 | Composición definitiva estable |

**Calostro:** volumen bajo (30–100 mL/día), pero altísima densidad inmunológica. Concentración de IgA secretora de hasta 12 g/L en las primeras 48h. Su alta osmolaridad y contenido de electrolitos favorece la expulsión del meconio.

### Composición de la Leche Madura (por 100 mL)

| Componente | Valor |
|---|---|
| Energía | 65–70 kcal |
| Proteínas | 0,9–1,1 g |
| Grasas | 3,5–4,5 g |
| Lactosa | 6,8–7,2 g |
| Osmolaridad | 286–295 mOsm/kg |

### Fracción Proteica — el dato que define todo

- **Suero : Caseína = 60:40** (en leche de vaca es 20:80)
- **α-lactoalbúmina: 20–25%** del total proteico
- **β-lactoglobulina: 0%** — no existe en leche humana
- Lactoferrina, lisozima, IgA secretora, seroalbúmina

> El objetivo de una fórmula avanzada no es igualar la cantidad de proteína, sino **aproximarse a su calidad**: perfil de aminoácidos, digestibilidad y baja alergenicidad.

## Determinantes del Requerimiento

Los requerimientos nutricionales del lactante están definidos por cinco factores:

1. **Metabolismo basal** — el lactante gasta ~55 kcal/kg/día solo en mantenimiento
2. **Tasa de crecimiento** — el peso se duplica a los 5 meses y se triplica al año
3. **Actividad física** — llanto, succión, movimiento
4. **Condiciones climáticas** — en clima tropical (Centroamérica) las pérdidas insensibles aumentan
5. **Condiciones patológicas** — fiebre, infección, malabsorción elevan la demanda

### Requerimiento Energético por Edad (ESPGHAN / OMS)

| Edad | kcal/kg/día |
|---|---|
| 0–3 meses | 100–110 |
| 3–6 meses | 90–100 |
| 6–12 meses | 80–90 |
| 12–36 meses | 80–85 |

### Requerimiento Proteico — el punto crítico

| Población | Proteína g/kg/día |
|---|---|
| Lactante término sano | 1,5–2,5 |
| Prematuro 1000–1800 g | 3,5–4,0 |
| Prematuro &lt;1000 g | 4,0–4,5 |

**Por qué importa:** el exceso proteico temprano eleva IGF-1 e insulina, acelera la proliferación de adipocitos y programa mayor riesgo de obesidad. Esta es la base del **Early Protein Hypothesis** que sustenta toda la línea PRO-α.

### Macronutrientes vs. Micronutrientes vs. Funcionales

| Macronutrientes | Micronutrientes | Ingredientes funcionales |
|---|---|---|
| Proteínas | Vitaminas | GOS / FOS / HMO |
| Hidratos de carbono | Minerales | Probióticos |
| Grasas | Elementos traza | Nucleótidos, DHA/ARA, taurina, colina |

Un **ingrediente funcional** es aquel que, además de su valor nutricional, aporta un beneficio demostrable para la salud.

## Los Tres Marcos que Rigen Nutribén®

### 1. Reglamento Delegado (UE) 2016/127
Rige **fórmulas de inicio y continuación**. Complementa al Reglamento (UE) 609/2013.

Rangos proteicos clave:
- Fórmula con proteína de suero **≥60%**: 0,54–0,67 g/100 kcal
- Fórmula con proteína de leche de vaca estándar: 0,43–0,69 g/100 kcal

**Este es el dato que habilita a Natal PRO-α:** al enriquecer con α-lactoalbúmina, puede bajar el total proteico a 1,3 g/100 mL sin salir del rango legal ni comprometer el aminoacidograma.

### 2. Reglamento Delegado (UE) 2016/128
Rige **Alimentos para Fines Médicos Especiales (FSMP)**: hidrolizadas, sin lactosa, soja, arroz hidrolizado y prematuros.

### 3. Codex Alimentarius
- **Codex Stan 72-1981** — preparados para lactantes
- **Codex Stan 156-1987** — preparados de continuación

Es el marco aplicable para registro sanitario en **Honduras (ARSA), El Salvador (MINSAL/DISAM), Nicaragua (MINSA) y Costa Rica**.

### ¿Por qué esto es un argumento de visita?

Nutribén® formula cumpliendo **simultáneamente** el marco europeo y el Codex. Como los estándares europeos son iguales o más exigentes en cada parámetro, el cumplimiento es automático hacia abajo.

## Lectura Técnica de Etiqueta — Herramienta de Campo

Cuando un médico te muestra una fórmula de la competencia, debes poder leerla en 30 segundos y encontrar el punto débil.

### Los 6 puntos a revisar, en orden

**1. Proteína total (g/100 mL)**
- &lt;1,3 g → fórmula de baja proteína, buen argumento anti-obesidad
- &gt;1,5 g → carga renal y riesgo metabólico elevados

**2. Relación suero:caseína**
- 60:40 → se aproxima a leche materna
- 50:50 o 40:60 → predominio de caseína, digestión más lenta

**3. ¿Menciona α-lactoalbúmina en la lista de ingredientes?**
Si no aparece explícitamente, la fracción de suero es predominantemente **β-lactoglobulina**. Este es el diferencial central de Nutribén®.

**4. Aceite de palma / aceite de palmiste**
Si aparece "aceite de palma" sin especificar posición sn-2 o beta-palmitato → el palmitato está en sn-1/sn-3 → jabones cálcicos → estreñimiento y menor absorción de calcio.

**5. Hidratos de carbono**
- 100% lactosa → estándar
- Lactosa + maltodextrina → fórmula confort o AR
- 100% maltodextrina → sin lactosa
- Presencia de **sacarosa, jarabe de glucosa o miel** → señal de alerta nutricional, sobre todo en fórmulas de crecimiento

**6. DHA y ARA**
Buscar la proporción. ESPGHAN y Regl. 2016/127 establecen **ARA:DHA entre 1:1 y 2:1**. Si solo declara DHA sin ARA, o el ARA es muy inferior, el perfil de ácidos grasos está incompleto.

| DHA:ARA | 1:1 (17:17 mg) | Solo DHA o ratio &lt;1:1 |
| Carga renal | 92 mOsm/L | &gt;100 mOsm/L |

## La Proteína Más Importante de la Leche Humana

### Definición
La **α-lactoalbúmina (α-LA)** es la proteína más abundante del suero de la leche humana madura: **20–25% del total proteico**. Se sintetiza exclusivamente en la glándula mamaria durante la lactación.

Peso molecular: 14,2 kDa · 123 aminoácidos · 4 puentes disulfuro intramoleculares · 1 sitio de unión a Ca²⁺

### Función Bioquímica Primaria: Lactosa Sintetasa

La α-LA es la **subunidad especificadora** del complejo enzimático lactosa sintetasa, junto con la β-1,4-galactosiltransferasa (GT-1).

**Sin α-LA:** GT-1 solo glicosila proteínas.
**Con α-LA:** la Km de GT-1 para glucosa cae de ~1 M a ~1 mM — un cambio de tres órdenes de magnitud que hace bioquímicamente viable la síntesis de lactosa.

Por eso la concentración de α-LA en calostro (~350 mg/L) supera la de leche madura (~180 mg/L): establecer la lactancia exige síntesis masiva de lactosa.

*(Lonnerdal B. Nutrition Reviews 2003;61:295–305)*

### Los 4 Beneficios Documentados

**1. Aminoacidograma superior**
Alta densidad de triptófano, lisina y cisteína. La leche de vaca aporta ~50% menos triptófano que la humana cuando se expresa como % de proteína total.

**2. Vía triptófano → serotonina → melatonina**
Trp → 5-HTP (triptófano hidroxilasa) → **Serotonina** (DOPA descarboxilasa) → N-acetilserotonina (AANAT) → **Melatonina** (HIOMT, pineal).
Impacto clínico: motilidad intestinal, confort emocional, maduración del ciclo circadiano entre el 3° y 6° mes.

**3. Digestibilidad superior**
Se hidroliza más rápido y completamente que caseína y β-lactoglobulina. Menor residuo proteico no digerido en colon → menos fermentación → menos cólico.

**4. Capacidad bifidogénica e inmunomoduladora**
Péptidos derivados de la α-LA tienen actividad antimicrobiana y estimulan el crecimiento de Bifidobacterium.

### El Contraste: β-Lactoglobulina

| | Leche humana | Leche de vaca |
|---|---|---|
| α-lactoalbúmina | 20–25% | ~4% |
| β-lactoglobulina | **0%** | ~10% |

La **β-lactoglobulina (Bos d 5) no existe en la leche humana**. Es completamente ajena al sistema inmune del lactante y constituye el principal antígeno de la APLV.

> **Reducir β-LG y aumentar α-LA = mejorar calidad proteica y reducir alergenicidad simultáneamente.** Ese es el núcleo de la plataforma PRO-α.

## Estereoquímica del Triglicérido: por qué la Posición Importa

Un triglicérido tiene tres posiciones de esterificación: **sn-1, sn-2 y sn-3**. El destino metabólico de un ácido graso depende de cuál ocupe.

### La Regla de las Lipasas
Las lipasas pancreáticas (lipasa + colipasa) hidrolizan **preferentemente sn-1 y sn-3**, dejando intacto el sn-2 como 2-monoglicérido.

### Caso A — Leche materna y grasa láctea (Nutribén®)
El ácido palmítico está mayoritariamente en **sn-2** (beta-palmitato).
→ Tras la hidrólisis queda como **2-monopalmitina**
→ Se absorbe eficientemente vía micelas mixtas
→ **No interactúa con Ca²⁺ luminal**

Nutribén® Natal PRO-α: **33% de beta-palmitato** por mezcla de grasa láctea + aceites vegetales.

### Caso B — Aceite de palma vegetal (competencia)
El ácido palmítico está en **sn-1 y sn-3**.
→ Se libera como **ácido graso libre** en el lumen
→ Se combina con Ca²⁺: **Ca(C₁₆H₃₁O₂)₂** — palmitato cálcico
→ Producto **insoluble** (Ksp ~10⁻¹⁰) que precipita

### Consecuencias clínicas de los jabones cálcicos

| Efecto | Mecanismo |
|---|---|
| Estreñimiento | Heces duras por precipitado insoluble |
| ↓ Absorción de calcio | Hasta 30% menos calcio biodisponible |
| ↓ Mineralización ósea | Menor contenido mineral óseo (BMC) |
| ↓ Absorción de DHA | El DHA coadsorbe al jabón y se excreta |
| ↓ Energía disponible | Pérdida calórica en heces |

### Evidencia: Béghìn L et al. (Clinical Nutrition 2019;38(3):1023–30)
RCT multicéntrico doble ciego, n=219 lactantes. Fórmula enriquecida en sn-2 palmitato vs. fórmula estándar.
**Resultados:** mejor consistencia de heces (escala Amsterdam), mayor contenido mineral óseo, mejor absorción de calcio en el grupo sn-2.

> **Frase de visita:** "El ácido palmítico no es el problema — la posición sí. En sn-2 se absorbe; en sn-1/sn-3 se convierte en jabón."
` },

## Modulación de la Microbiota Intestinal

### ¿Qué es un prebiótico?
Sustrato no digerible en intestino delgado que es **fermentado selectivamente** por bacterias beneficiosas del colon, produciendo un beneficio para el huésped.

### GOS — Galactooligosacáridos
**Origen:** síntesis enzimática a partir de lactosa mediante β-galactosidasa.
**Presente en:** Natal PRO-α, Continuación PRO-α, Crecimiento PRO+, CONFORT (0,4 g/100 mL).

**Mecanismo completo:**
1. GOS llegan intactos al colon (no hay enzimas humanas que los degraden)
2. Fermentación selectiva por *Bifidobacterium* y *Lactobacillus*
3. Producción de **AGCC** — ácidos grasos de cadena corta:
   - **Acetato** → acidifica el colon a pH 5,0–5,5
   - **Butirato** → combustible principal del colonocito, refuerza tight junctions
   - **Propionato** → metabolismo hepático
4. El pH ácido **inhibe** Clostridium, Salmonella y E. coli patógena
5. Resultado: microbiota similar a la del lactante amamantado

### FOS — Fructooligosacáridos
**Origen:** inulina vegetal (raíz de achicoria) parcialmente hidrolizada. **100% libre de proteína láctea.**
**Presente en:** Hidrolizada 1 y 2.

**Por qué FOS en lugar de GOS en las hidrolizadas:**
Los GOS derivan de lactosa y pueden arrastrar **trazas de proteínas séricas**. En una fórmula para APLV, donde el umbral de reacción puede ser de microgramos, eso es inaceptable. Los FOS eliminan ese riesgo desde el origen.

Funcionalmente ambos son bifidogénicos. La diferencia es de **seguridad alérgica**, no de eficacia prebiótica.

### HMO — Oligosacáridos de Leche Materna
**2'-fucosil-lactosa (2'FL):** el HMO más abundante en leche humana (~30% del total de HMO).
Presente en la formulación actualizada de Natal PRO-α.

**Funciones:** efecto prebiótico, señuelo de adhesión para patógenos (bloquea fimbrias bacterianas), modulación directa de la respuesta inmune innata.

### Cuándo NO usar prebióticos
**Nutribén® Sin Lactosa NO contiene GOS ni FOS.** En un cuadro diarreico, los prebióticos aceleran el tránsito y aumentan la carga osmótica luminal, agravando la diarrea. Esta ausencia es una decisión de formulación deliberada, no una carencia.

## LC-PUFA en el Desarrollo Neurológico

### Las dos series
- **Omega-3:** ALA (C18:3) → EPA (C20:5) → **DHA (C22:6)**
- **Omega-6:** LA (C18:2) → GLA (C18:3) → DGLA (C20:3) → **ARA (C20:4)**

Ambas compiten por las mismas desaturasas (Δ6 y Δ5), por eso la proporción dietética importa tanto como la cantidad.

### DHA — Ácido Docosahexaenoico
Constituye el **40% de los fosfolípidos** de la sustancia gris cerebral y el **60%** de los segmentos externos de los fotorreceptores retinianos.

**Ventana crítica:** el DHA cerebral aumenta casi **30 veces** en la corteza frontal durante el tercer trimestre gestacional y los primeros 6 meses postnatales. Un prematuro pierde gran parte de esa acreción.

Natal PRO-α: **17 mg DHA/100 mL**.

### ARA — Ácido Araquidónico
Segundo LC-PUFA más abundante en el cerebro. Precursor de eicosanoides.

**Vía proinflamatoria:** ARA → [COX-2] → **PGE2** · ARA → [5-LOX] → **LTB4 / LTC4**

Natal PRO-α: **17 mg ARA/100 mL** — ratio **1:1** con DHA, conforme a ESPGHAN.

### GLA — Ácido Gamma-Linolénico (el caso de las hidrolizadas)

En **Nutribén® Hidrolizada** el ARA se sustituye por GLA. La razón es específica de la dermatitis atópica:

- El GLA se elonga a **DGLA** → **PGE1**, que es **antiinflamatoria**
- El DGLA **compite con el ARA** por la COX-2, reduciendo la producción de PGE2
- Los queratinocitos atópicos tienen **déficit de Δ6-desaturasa**: el GLA no se convierte a ARA en la piel, pero sí en hígado y tejido nervioso

> **Resultado:** el lactante obtiene ARA sistémico para el desarrollo del SNC, sin agravar la inflamación cutánea del eczema.

### Fuente del DHA: microalga vs. aceite de pescado
El DHA de *Schizochytrium* sp. es **químicamente idéntico** al de aceite de pescado. Las microalgas son el origen de la cadena trófica — los peces no sintetizan DHA, lo acumulan.

**Ventajas del origen microalgal:** sin metilmercurio, PCB ni dioxinas; producción controlada; aprobado GRAS por FDA y evaluado por EFSA.

    { id:"t3l1", title:"Cólico del Lactante", duration:"9 min", content:`
## Definición y Epidemiología

**Criterios de Roma IV (2016):** episodios recurrentes de llanto o irritabilidad, sin causa aparente, que no pueden ser prevenidos ni resueltos por los cuidadores, en un lactante &lt;5 meses, sin fallo de medro, fiebre ni enfermedad.

**Regla clásica de Wessel ("regla del tres"):** llanto ≥3 h/día, ≥3 días/semana, durante ≥3 semanas.

**Prevalencia:** 20–25% según criterios estrictos; hasta 70% de los lactantes presentan episodios de llanto excesivo en algún momento.
**Pico:** 6 semanas de vida. **Resolución espontánea:** 3–4 meses en el 90% de los casos.

## Fisiopatología — cuatro mecanismos concurrentes

**1. Inmadurez enzimática digestiva**
La lactasa del borde en cepillo alcanza solo el 30–70% de la actividad adulta en el lactante &lt;3 meses. La lactosa no digerida llega al colon.

**2. Fermentación colónica**
La microbiota fermenta la lactosa residual produciendo **H₂, CO₂ y ácidos orgánicos**. La acumulación de gas genera distensión luminal, espasmo del músculo liso y dolor visceral.

**3. Digestión proteica incompleta**
Péptidos de β-lactoglobulina no hidrolizados prolongan el vaciamiento gástrico y actúan como estímulo proinflamatorio de bajo grado en la mucosa.

**4. Disbiosis**
Menor abundancia de *Bifidobacterium* y *Lactobacillus*, mayor de *Clostridium* y *E. coli* productoras de gas.

## Diagnóstico diferencial obligatorio

| Cuadro | Signo diferencial |
|---|---|
| **APLV no-IgE** | Sangre en heces, eczema, fallo de medro, antecedente familiar de atopia |
| **RGE patológico** | Regurgitación con arqueo, rechazo del alimento, estancamiento ponderal |
| **Estreñimiento** | Deposiciones duras, esfuerzo defecatorio |
| **Infección** | Fiebre, decaimiento, alteración de constantes |

> **Regla clínica:** cólico + sangre en heces o eczema **no es cólico funcional** — es APLV hasta demostrar lo contrario.

## Abordaje nutricional
Reducir carga fermentable (menos lactosa), mejorar digestibilidad proteica (hidrólisis parcial), asegurar absorción lipídica (TCM) y modular microbiota (GOS).
→ Estos son exactamente los cuatro mecanismos de **Nutribén® CONFORT**.
` },
    { id:"t3l2", title:"Reflujo Gastroesofágico y Regurgitación", duration:"8 min", content:`
## RGE Fisiológico vs. ERGE Patológico

**Regurgitación fisiológica:** presente en el **50% de los lactantes &lt;3 meses**. Pico a los 4 meses. Resolución en el 90% antes de los 12 meses.

**Causa:** inmadurez del esfínter esofágico inferior (EEI), ángulo de His obtuso, esófago abdominal corto, y dieta exclusivamente líquida con alto volumen relativo (150 mL/kg/día — equivalente a 10 L/día en un adulto).

### Cuándo es patológico (ERGE) — signos de alarma

| Signo | Implicación |
|---|---|
| Fallo de medro | Pérdida calórica significativa |
| Rechazo del alimento / irritabilidad con las tomas | Esofagitis |
| Arqueamiento (síndrome de Sandifer) | Dolor esofágico |
| Hematemesis | Esofagitis erosiva |
| Apneas, estridor, neumonías recurrentes | Aspiración |
| Vómito en proyectil / bilioso | **Derivar: obstrucción** |

### Escala de regurgitación (Vandenplas)
0 = ninguna · 1 = &lt;5 episodios/día de bajo volumen · 2 = &gt;5 episodios de &lt;10 mL · 3 = &gt;5 episodios de ~10 mL · 4 = regurgitación constante · 5 = regurgitación con rechazo

## Abordaje nutricional — el espesante

**Principio:** aumentar la viscosidad del contenido gástrico para reducir el número de episodios de regurgitación.

**Tipos de espesante:**

| Agente | Mecanismo | Consideración |
|---|---|---|
| **Almidón de maíz / arroz precocido** | Espesa en el estómago por acidez | No aumenta la osmolaridad; digerible; aporta calorías |
| **Goma de algarroba (garrofín)** | Espesa en el biberón antes de la toma | No digerible; puede acelerar el tránsito y causar heces blandas |

**Posicionamiento ESPGHAN (JPGN 2002;34:496–8):** las fórmulas AR reducen el número de episodios visibles de regurgitación, pero **no reducen necesariamente el índice de reflujo ácido medido por pHmetría**. Son eficaces sobre el síntoma, no sustituyen el tratamiento médico de una ERGE establecida.

### Medidas no farmacológicas concurrentes
- Tomas más frecuentes y de menor volumen
- Posición vertical 20–30 min tras la toma
- **Decúbito supino para dormir** (nunca prono, por riesgo de SMSL)
- Evitar exposición a humo de tabaco
` },
    { id:"t3l3", title:"Estreñimiento Funcional del Lactante", duration:"8 min", content:`
## Definición y Frecuencia Normal

**Criterios de Roma IV para &lt;4 años:** ≥2 de los siguientes durante ≥1 mes:
- ≤2 deposiciones por semana
- Historia de retención fecal excesiva
- Deposiciones dolorosas o duras
- Deposiciones de gran diámetro
- Masa fecal en recto

### Frecuencia esperada por edad y alimentación

| Edad | Lactancia materna | Fórmula |
|---|---|---|
| 0–3 meses | 3–5/día (o 1 cada 7–10 días, normal si son blandas) | 2–3/día |
| 6–12 meses | 2/día | 1–2/día |

**Prevalencia en alimentados con fórmula:** 5–30%, muy superior al 1–3% de los amamantados.

## Escala de Bristol / Amsterdam (consistencia)
1 = bolas duras separadas · 2 = grumosa y dura · 3 = grumosa en superficie · **4 = lisa y blanda (ideal)** · 5 = blanda con bordes definidos · 6 = pastosa · 7 = líquida

## Fisiopatología en el lactante alimentado con fórmula

**Mecanismo 1 — Jabones cálcicos (el más relevante)**
Ácido palmítico en sn-1/sn-3 → liberado como ácido graso libre → se une a Ca²⁺ → **palmitato cálcico insoluble** → endurece las heces.

**Mecanismo 2 — Composición proteica**
Predominio de caseína → coágulo gástrico firme → tránsito más lento.

**Mecanismo 3 — Microbiota deficitaria**
Menor producción de AGCC → menor estímulo de la motilidad colónica y menor retención de agua en el bolo.

**Mecanismo 4 — Dilución incorrecta**
Fórmula preparada con exceso de polvo → mayor carga osmótica y menor agua libre. **Siempre verificar la técnica de preparación antes de cambiar de fórmula.**

## Abordaje nutricional
1. Verificar dilución correcta (1 medida rasa por 30 mL de agua)
2. Fórmula **sin aceite de palma** con beta-palmitato sn-2
3. Prebióticos **GOS** para producción de AGCC
4. Asegurar aporte hídrico adecuado

> **Frase de visita:** "Antes de recetar un laxante, revise si la fórmula tiene aceite de palma. En muchos casos el estreñimiento es un efecto de formulación, no un problema del bebé."

    { id:"t3l4", title:"APLV: Clasificación, Diagnóstico y Manejo", duration:"11 min", content:`
## Alergia a Proteínas de Leche de Vaca

**Prevalencia:** 2–3% de los lactantes. Es la **alergia alimentaria más frecuente en menores de 1 año**.
**Resolución:** ~50% al año, ~75% a los 3 años, &gt;90% a los 5 años.

### Los antígenos

| Fracción | Antígeno | % del total |
|---|---|---|
| Caseínas | Bos d 8 | ~80% |
| β-lactoglobulina | **Bos d 5** | ~10% |
| α-lactoalbúmina | Bos d 4 | ~4% |
| Seroalbúmina bovina | Bos d 6 | ~1% |

**Bos d 5 (β-lactoglobulina)** es el antígeno más relevante clínicamente por estar totalmente ausente en la leche humana.

## Clasificación Inmunológica

| Tipo | Mecanismo | Clínica | Latencia |
|---|---|---|---|
| **IgE mediada** | Anticuerpos IgE específicos, degranulación mastocitaria | Urticaria, angioedema, vómito inmediato, broncoespasmo, anafilaxia | Minutos – 2 h |
| **No IgE mediada** | Mecanismos celulares (linfocitos T) | Proctocolitis, FPIES, enteropatía, reflujo, cólico, estreñimiento | 2 h – días |
| **Mixta** | Ambos | Esofagitis eosinofílica, dermatitis atópica | Variable |

## Formas clínicas no-IgE

**FPIAP — Proctocolitis alérgica**
La más común en neonatos. Lactante con buen estado general y **sangre roja fresca en heces**. IgE normal. Excelente pronóstico.

**FPIES — Síndrome de enterocolitis inducida por proteínas**
Vómitos repetitivos 1–4 h post-ingesta, palidez, letargia, hipotensión. Forma **grave**.

**Enteropatía inducida por proteínas**
Diarrea crónica, malabsorción, fallo de medro, hipoalbuminemia.

## Señales de sospecha (Consenso SEGHNP/AEPAP/SEPEAP/SEICAP 2019)
- Antecedente familiar de atopia
- **Afectación de múltiples aparatos** (digestivo + cutáneo + respiratorio)
- **Ausencia de respuesta** al tratamiento habitual de cólico, reflujo o estreñimiento

## Algoritmo de manejo según severidad

| Severidad | Presentación | Primera línea |
|---|---|---|
| **Leve–moderada** | Cólico, reflujo, proctocolitis, eczema moderado | **FEH** (fórmula extensamente hidrolizada) |
| **Severa** | Anafilaxia, FPIES grave, enteropatía con fallo de medro | **Fórmula elemental** (aminoácidos libres) |

**Duración de la dieta de eliminación:** mínimo 2–4 semanas para evaluar respuesta.
**Confirmación diagnóstica:** prueba de provocación oral (PPO) supervisada, habitualmente a los 6–12 meses.

> **Límite que debes conocer:** Nutribén® Hidrolizada 1 es primera línea en APLV **leve-moderada**, que es el 80–90% de los casos. En APLV severa con anafilaxia, la primera línea es fórmula elemental. Conocer este límite genera credibilidad ante el alergólogo.
` },
    { id:"t3l5", title:"Diarrea Aguda e Intolerancia a la Lactosa", duration:"9 min", content:`
## Diarrea Aguda en el Lactante

**Definición:** aumento de la frecuencia y disminución de la consistencia de las deposiciones, de &lt;14 días de duración.
**Etiología principal:** viral (rotavirus, norovirus, adenovirus). Bacteriana y parasitaria son minoritarias en el lactante.

### Pilares del tratamiento (ESPGHAN/OMS)
1. **Rehidratación oral** con SRO de baja osmolaridad — es la intervención que salva vidas
2. **Realimentación precoz** — reiniciar en 4–6 h; el ayuno prolongado atrofia las vellosidades
3. **No suspender la lactancia materna** en ningún caso
4. **Zinc** — la OMS recomienda 10–20 mg/día durante 10–14 días en países en desarrollo
5. Considerar **probióticos** — *L. rhamnosus* GG y *S. boulardii* tienen la mejor evidencia

## Deficiencia Secundaria de Lactasa

La lactasa se ubica en el **ápice de las vellosidades intestinales**, la zona más vulnerable al daño viral.

**Secuencia fisiopatológica:**
1. Infección viral → destrucción de enterocitos apicales
2. Pérdida de la lactasa del borde en cepillo
3. Lactosa no digerida → carga osmótica en el lumen → arrastre de agua
4. Fermentación colónica → gas, ácidos orgánicos, más agua
5. **Diarrea osmótica que perpetúa el cuadro**

**Recuperación:** 2–4 semanas. Es transitoria, no permanente.

### Tipos de intolerancia a la lactosa

| Tipo | Frecuencia | Curso |
|---|---|---|
| **Congénita (alactasia)** | Muy rara | Permanente, desde el nacimiento |
| **Secundaria** | Común | Transitoria, post-infecciosa |
| **Primaria del adulto** | Muy frecuente | Progresiva, inicio tras los 5 años |

## Evidencia sobre fórmulas sin lactosa

**Metaanálisis Cochrane** (fórmulas sin lactosa en diarrea aguda):
- Reducción de la duración de la diarrea en ~**18 horas** (16 ensayos)
- Reducción del fracaso terapéutico en aproximadamente **la mitad** (18 ensayos)

**Posicionamiento ESPGHAN/OMS:** la dieta sin lactosa se considera en niños con **diarrea que persiste &gt;7 días** o en **hospitalizados por gastroenteritis severa**. No es de rutina en toda diarrea aguda.

> **Distinción crítica que un pediatra valora:** intolerancia a la lactosa ≠ APLV. La primera es un déficit enzimático (problema de digestión); la segunda es una reacción inmunológica (problema de reconocimiento antigénico). Confundirlas ante un médico destruye la credibilidad técnica del visitador.
` }

## Nutribén® Natal PRO-α — Ficha Técnica

**Indicación:** alimentación del lactante sano desde el nacimiento hasta los 6 meses, cuando la lactancia materna no es posible o es insuficiente.
**Marco regulatorio:** Regl. Delegado (UE) 2016/127 · Codex Stan 72-1981

### Composición por 100 mL (dilución estándar 13%)

| Nutriente | Valor |
|---|---|
| Energía | 67 kcal |
| **Proteínas** | **1,3 g** |
| Relación suero:caseína | **60:40** |
| Hidratos de carbono (lactosa) | 7,3 g |
| Grasas | 3,5 g |
| **Beta-palmitato (sn-2)** | **33%** |
| DHA | 17 mg |
| ARA | 17 mg |
| GOS | 0,4 g |
| **Carga renal de solutos** | **92 mOsm/L** |
| Osmolaridad | ~285 mOsm/L |

### Fracción proteica — el diferencial
La proteína de suero está **enriquecida con α-lactoalbúmina**, que pasa a ser la fracción dominante del suero en lugar de la β-lactoglobulina.

**Consecuencia directa:** menor contenido de β-LG → menor alergenicidad, y mejor aminoacidograma → posibilidad de reducir la proteína total a 1,3 g/100 mL sin comprometer el aporte de aminoácidos esenciales.

### Aminoacidograma comparado (mg/100 kcal)

| Aminoácido | Mínimo Directiva UE | Natal PRO-α | Diferencia |
|---|---|---|---|
| Triptófano | 32 | **36** | +12,5% |
| Lisina | 113 | **190** | +68% |
| Cisteína | 38 | 34 | Optimizado |

### Fracción lipídica
Mezcla de **grasa láctea + aceites vegetales**. Sin aceite de palma. 33% del ácido palmítico en posición sn-2.

### Hidratos de carbono
100% lactosa — igual que la leche materna. Sin maltodextrina, sin sacarosa, sin jarabe de glucosa.

### Ingredientes funcionales
GOS 0,4 g/100 mL · 2'-fucosil-lactosa (2'FL) · Nucleótidos · Taurina · L-carnitina · Colina · Inositol

## Del Ingrediente al Beneficio Clínico

### 1. Mayor aproximación al perfil de la leche materna

## El Argumento Central de la Unidad

Muchos pediatras y familias asumen que al iniciar la alimentación complementaria la leche pasa a ser secundaria. Los datos dicen lo contrario.

### Cuánto cubre realmente la alimentación complementaria (OMS / ESPGHAN)

| Rango de edad | Aporte energético de la AC | Aporte de la leche |
|---|---|---|
| 6–8 meses | ~30% | **~70%** |
| 9–11 meses | ~45% | ~55% |
| 12–23 meses | ~60% | ~40% |

**Recomendación ESPGHAN:** mantener 500–600 mL/día de leche materna o fórmula entre los 6 y 12 meses.

### Por qué no leche de vaca entera antes del año

| Parámetro | Leche de vaca entera | Continuación PRO-α |
|---|---|---|
| Proteínas | 3,6 g/100 mL | **1,3 g** |
| Carga renal | Muy elevada | **98 mOsm/L** |
| Hierro | ~0,05 mg/100 mL, baja biodisponibilidad | Enriquecido |
| Vitamina D | Prácticamente ausente | Enriquecida |
| DHA/ARA | Ausentes | Presentes |
| Prebióticos | Ausentes | GOS 0,4 g |

**El problema del hierro es doble:** la leche de vaca entera no solo aporta muy poco hierro, sino que además **interfiere con su absorción** (por su alto contenido de calcio y caseína) y puede producir **microsangrado intestinal oculto** en menores de 12 meses. Por eso la ESPGHAN y la AAP la desaconsejan antes del año.

### La ventana crítica del hierro
Las reservas hepáticas de hierro acumuladas durante la gestación se agotan hacia el **cuarto-sexto mes**. Entre los 6 y 12 meses el lactante tiene el mayor requerimiento de hierro por kg de peso de toda su vida (**11 mg/día** según recomendaciones), coincidiendo con el momento en que sus reservas están vacías.

**Consecuencia de no cubrirlo:** anemia ferropénica, con impacto documentado en el desarrollo cognitivo y psicomotor que puede ser **parcialmente irreversible** incluso tras la corrección.

### El desarrollo neurológico continúa
El cerebro sigue acumulando DHA activamente hasta los 2 años. La alimentación complementaria típica en Centroamérica (cereales, purés de verdura, frutas) aporta muy poco DHA.

> **Frase de visita:** "El error más común no es qué fórmula se elige a los 6 meses — es dejar de dar fórmula a los 6 meses."

## Crecimiento PRO+ — Ficha Técnica

**Indicación:** niños de 12 a 36 meses, como componente lácteo de una dieta diversificada.

### Composición por 100 mL

| Nutriente | Crecimiento PRO+ | Leche de vaca entera |
|---|---|---|
| Energía | 67 kcal | 65 kcal |
| **Proteínas** | **1,6 g** | **3,6 g** |
| **Reducción proteica** | **−38,5%** | referencia |
| α-lactoalbúmina | ❌ No | ❌ No |
| Carga renal | **121 mOsm/L** | Muy elevada |
| Hierro | Enriquecido | ~0,05 mg |
| Vitamina D | Enriquecida | Trazas |
| **GOS** | **✅ 0,4 g** | ❌ |
| DHA | ✅ | ❌ |
| **Sacarosa** | **❌ Ausente** | — |
| Aceite de palma | **❌ Ausente** | — |

### El cambio de paradigma

En Natal y Continuación el objetivo era **calidad proteica** — por eso la α-lactoalbúmina.
En Crecimiento el objetivo cambia: la dieta del niño de 1 a 3 años ya incluye carne, huevo, legumbres, lácteos y cereales. Los aminoácidos esenciales llegan de múltiples fuentes.

**El problema ya no es la calidad. Es el exceso.**

Un niño de 2 años que toma 500 mL de leche de vaca entera al día recibe **18 g de proteína solo de la leche**, cuando su requerimiento total diario ronda los 13–15 g. Sumado a la proteína de la dieta sólida, la ingesta puede triplicar el requerimiento.

### Por eso las tres decisiones de Crecimiento PRO+
1. **−38,5% de proteína** frente a la leche de vaca entera
2. **Adición de GOS** — novedad respecto a la versión anterior de Crecimiento
3. **Sin sacarosa** — el dulzor procede solo de la lactosa

> **Frase de visita:** "En Natal buscamos la mejor proteína posible. En Crecimiento buscamos la menor cantidad necesaria. Es el mismo objetivo — prevenir obesidad — con la herramienta que corresponde a cada edad."

    { id:"u3l2", title:"Evidencia: Proteína Temprana y Riesgo de Obesidad", duration:"9 min", content:`
## La Base Científica de la Reducción Proteica

### El "Early Protein Hypothesis"
Un aporte proteico elevado en los primeros 2 años eleva la secreción de **insulina** e **IGF-1** (factor de crecimiento insulínico tipo 1). El IGF-1 estimula la diferenciación y proliferación de **preadipocitos**, aumentando la celularidad del tejido adiposo de forma permanente.

**Consecuencia:** el número de adipocitos establecido tempranamente predispone a obesidad en edad escolar y adulta, aunque se corrija la dieta después.

### Estudio CHOP — validación clínica
*(Weber M et al. Am J Clin Nutr 2014;99(5):1041–51)*

El brazo de crecimiento del estudio es especialmente relevante para esta unidad:
- Grupo alta proteína: **4,4 g/100 kcal** en fórmula de crecimiento
- Grupo baja proteína: **2,2 g/100 kcal**
- OR de obesidad a los 6 años: **2,43 (IC95% 1,12–5,27)**

### Metaanálisis Hörnell
*(Hörnell A et al. European Journal of Nutrition 2013)*
11 estudios independientes, sin financiamiento industrial. Confirma la asociación entre ingesta proteica elevada en los primeros 2 años y mayor IMC posterior.

### El "adiposity rebound"
El rebote adiposo es el momento en que el IMC, tras descender desde el año de vida, vuelve a subir — normalmente entre los **5 y 7 años**. Un rebote adiposo **precoz** (antes de los 5 años) es uno de los predictores más robustos de obesidad adulta. La ingesta proteica elevada en los primeros 2 años se asocia a rebote adiposo precoz.

### El contexto centroamericano
Honduras, El Salvador y Nicaragua presentan la **doble carga de malnutrición**: coexistencia de desnutrición crónica (talla baja) y sobrepeso infantil en aumento. La programación metabólica temprana es un factor modificable en ambos extremos.

> **Argumento de salud pública:** "La leche de vaca entera a los 2 años no es un problema de desnutrición. Es un problema de sobrecarga proteica en una etapa de programación metabólica."

**Respuesta:** "Sí, sin duda. Y por eso no se la recomendaría a todos sus pacientes. Yo la posicionaría en dos grupos: el niño con antecedente familiar de obesidad o diabetes tipo 2, donde el argumento de programación metabólica pesa; y el niño con alimentación selectiva que no come carne, donde el hierro y el zinc de la fórmula cubren un hueco real. En el resto, su criterio."

## MECANISMO 1 — Hidrólisis parcial y SELECTIVA (77,7%)

El sistema patentado de CONFORT hidroliza el **77,7% de las proteínas séricas**, incluyendo prácticamente toda la β-lactoglobulina, **manteniendo la α-lactoalbúmina intacta**.

**Por qué es posible la selectividad:** la α-LA tiene una estructura terciaria estabilizada por **4 puentes disulfuro intramoleculares** (Cys6-Cys120, Cys28-Cys111, Cys61-Cys77, Cys73-Cys91) y un sitio de unión a Ca²⁺ que rigidiza su conformación, haciéndola resistente a la proteólisis bajo condiciones controladas. La β-LG, con estructura β-barrel y sitios de corte accesibles, se hidroliza fácilmente.

---

## MECANISMO 2 — Reducción del 50% de lactosa

**50% lactosa + 50% maltodextrina.**

Fundamento: en el lactante <3 meses la lactasa opera al 30–70% de su capacidad. La lactosa no digerida se fermenta en colon produciendo H₂, CO₂ y ácidos orgánicos → distensión y dolor.

⚠️ **No es una fórmula sin lactosa.** El bebé sí digiere lactosa; solo se reduce la carga fermentable.

---

## MECANISMO 3 — Triglicéridos de cadena media (+10%)

Los **TCM (C8–C10)** no requieren emulsificación por sales biliares ni hidrólisis completa por lipasa pancreática. Se absorben directamente en el enterocito y pasan por **vena porta** al hígado, evitando la vía linfática de quilomicrones.

**Relevancia en cólico:** durante el espasmo intestinal la secreción de bilis y lipasa está comprometida. Los TCM mantienen la absorción lipídica y el aporte calórico incluso en ese contexto.

---

**4a) Beta-palmitato sn-2:** el palmitato permanece como 2-monoglicérido absorbible, no forma jabones cálcicos → heces blandas + mejor absorción de calcio y DHA.

## Nutribén® Hidrolizada 1 y 2 — Ficha Técnica

**Indicación:** APLV leve-moderada, intolerancia a la lactosa, dermatitis atópica asociada a alergia alimentaria, diarreas de diverso origen.
**Marco:** Regl. Delegado (UE) 2016/128 (FSMP)
**Manual técnico:** Nutribén® Hidrolizada 1 y 2, Ed. 8, mayo 2020

| Parámetro | Hidrolizada 1 (0–6 m) | Hidrolizada 2 (6–12 m) |
|---|---|---|
| Fuente proteica | **100% caseína hidrolizada** | 100% caseína hidrolizada |
| **Péptidos <1.000 Da** | **97,9%** | 97,9% |
| β-lactoglobulina | **0%** | 0% |
| Lactosa | Ausente / 100% maltodextrina | Ausente / maltodextrina |
| **Prebiótico** | **FOS** (no GOS) | FOS |
| **Probiótico** | — | **L. rhamnosus** ✅ |
| LC-PUFA | **DHA + GLA** (no ARA) | DHA + GLA |
| L-cistina | ✅ (mejora sabor) | ✅ |
| Aceite de palma | Ausente | Ausente |

### La paradoja de la caseína

**Pregunta frecuente:** si la caseína es más alergénica que el suero (Bos d 8 = 80% del total proteico), ¿por qué se usa como fuente del hidrolizado?

**Respuesta:** por su **estructura**. La caseína es una proteína desordenada (*random coil*), sin estructura terciaria estabilizada por puentes disulfuro. Eso la hace **extremadamente susceptible a la hidrólisis enzimática completa**.

Los hidrolizados de suero, en cambio, parten de α-LA y β-LG, ambas proteínas globulares estabilizadas por puentes disulfuro, mucho más resistentes a la hidrólisis extensa.

**Resultado:** el hidrolizado de caseína genera péptidos **más pequeños** — 97,9% por debajo de 1.000 Da.

### Por qué importa el umbral de 1.000 Da
Un péptido de <1.000 Da tiene aproximadamente **8–10 aminoácidos**. Para desencadenar la degranulación mastocitaria, un antígeno debe hacer de "puente" entre **dos moléculas de IgE** unidas al receptor FcεRI. Un péptido tan corto no puede unir simultáneamente dos epítopos → **capacidad antigénica mínima**.

**Ventaja adicional:** al partir de caseína, hay **0% de β-lactoglobulina** — el antígeno más relevante de la APLV — sin posibilidad de trazas.

    { id:"u5l2", title:"Las Cuatro Innovaciones Diferenciales", duration:"11 min", content:`
## Lo que Hace Única a Nutribén® Hidrolizada

### INNOVACIÓN 1 — L-cistina: el problema del sabor resuelto

**El problema:** las fórmulas hidrolizadas tienen olor y sabor característicamente desagradables. La causa son los **grupos sulfhídricos libres (-SH)** de la L-cisteína, expuestos al fragmentarse las proteínas.

**La solución Nutribén®:** convertir la L-cisteína en **L-cistina** mediante formación de un **puente disulfuro** (dos cisteínas unidas por -S-S-). Los grupos -SH quedan enmascarados.

**Impacto clínico:** mejor palatabilidad → mejor aceptación → **mejor adherencia terapéutica**. En APLV, una fórmula rechazada es una fórmula que no trata.

---

### INNOVACIÓN 2 — GLA en lugar de ARA

**El problema:** el ARA (ácido araquidónico) es precursor de mediadores proinflamatorios:
- ARA → [COX-2] → **PGE2**
- ARA → [5-LOX] → **LTB4, LTC4** (quimiotácticos de eosinófilos)

En un paciente con dermatitis atópica, aumentar el ARA puede **agravar las placas de eczema**.

**La solución:** usar **GLA** (ácido gamma-linolénico, C18:3 n-6).
- GLA → elongasa → **DGLA** → **PGE1 antiinflamatoria**
- El DGLA **compite con el ARA** por la COX-2, reduciendo la producción de PGE2
- Los queratinocitos atópicos tienen **déficit de Δ6-desaturasa**: el GLA no se convierte a ARA en la piel, pero **sí en hígado y tejido nervioso**

**Resultado:** aporte sistémico de ARA para el desarrollo del SNC, **sin agravar la inflamación cutánea**.

---

### INNOVACIÓN 3 — FOS en lugar de GOS

**El problema:** los GOS se sintetizan a partir de **lactosa** mediante β-galactosidasa. Pueden contener **trazas de proteínas séricas co-purificadas**. En APLV, donde el umbral de reacción puede ser de microgramos, eso es inaceptable.

**La solución:** **FOS** (fructooligosacáridos), derivados de **inulina vegetal** (raíz de achicoria). 100% libres de proteína láctea.

Funcionalmente ambos son bifidogénicos. La diferencia es de **seguridad**, no de eficacia prebiótica.

---

### INNOVACIÓN 4 — L. rhamnosus en Hidrolizada 2

**Evidencia:** Majamaa H & Isolauri E. *J Allergy Clin Immunol* 1997;99(2):179–185.

**Diseño:** 27 lactantes con APLV y eczema atópico.
- Grupo 1 (n=14): FEH sola
- Grupo 2 (n=13): FEH + *L. rhamnosus* GG (5×10⁸ UFC/g)

**Resultados a 4 semanas:**

| Marcador | Efecto en grupo LGG |
|---|---|
| **IgA fecal** | ↑ significativo (p<0,01) — refuerzo de la barrera inmune mucosa |
| **TNF-α fecal** | ↓ — menor inflamación intestinal |
| **ECP fecal** (proteína catiónica del eosinófilo) | ↓ — menor activación eosinofílica |
| **Score SCORAD** | Mejoría significativa del eczema |

**Mecanismo propuesto:** *L. rhamnosus* promueve polarización **Th1** y producción de **IL-10 y TGF-β** (antiinflamatorias), contrarrestando la respuesta Th2 patológica de la alergia.

---

### Sin aceite de palma
Es la **única fórmula extensamente hidrolizada del mercado sin aceite de palma**, lo que asegura la correcta absorción de calcio y DHA — especialmente relevante en un paciente con malabsorción asociada.
No usa grasa láctea, para evitar cualquier riesgo de contaminación proteica.
` },
    { id:"u5l3", title:"Indicación Clínica y Límites del Producto", duration:"10 min", content:`
## ¿A qué paciente le indico Hidrolizada?

### Indicaciones
- **APLV leve-moderada** — primera línea (80–90% de los casos de APLV)
- Intolerancia congénita o transitoria a la lactosa
- Gastroenteritis aguda con déficit de lactasa
- Dermatitis atópica asociada a alergia alimentaria
- Diarreas de diverso origen

**Hidrolizada 1:** 0–6 meses · **Hidrolizada 2:** 6–12 meses (añade L. rhamnosus)

### El algoritmo de severidad — el límite que debes conocer

| Severidad | Presentación | Primera línea |
|---|---|---|
| **Leve–moderada** | Proctocolitis, cólico, reflujo, eczema moderado, estreñimiento | **FEH — Hidrolizada 1** ✅ |
| **Severa** | Anafilaxia, FPIES grave con shock, enteropatía con fallo de medro | **Fórmula elemental** (aminoácidos libres) ❌ |

> **Nutribén® Hidrolizada NO es la primera línea en APLV severa.** Conocer este límite ante un alergólogo genera credibilidad; ignorarlo la destruye.

### Duración y confirmación diagnóstica
- **Dieta de eliminación:** mínimo 2–4 semanas para evaluar respuesta
- **Mejoría esperada:** sangrado en heces 1–2 semanas; otros síntomas GI 2–4 semanas
- **Confirmación:** prueba de provocación oral (PPO) supervisada, habitualmente a los 6–12 meses
- Si no hay mejoría con FEH tras 4 semanas → **escalar a fórmula elemental**

### La madre que amamanta
En APLV con lactancia materna, la primera línea **no es cambiar a fórmula** — es la **dieta de exclusión de proteína de leche de vaca en la madre**, manteniendo la lactancia y suplementando calcio y vitamina D. Solo si eso falla o no es viable se recurre a FEH.

> Decir esto ante un pediatra demuestra que el visitador prioriza el criterio clínico sobre la venta.

### Pronóstico de la APLV
Resolución: ~50% al año · ~75% a los 3 años · >90% a los 5 años.
La FEH es un tratamiento **transitorio**, no permanente.

    { id:"u5l5", title:"Manejo de Objeciones — Hidrolizada", duration:"10 min", content:`
## Objeciones Frecuentes

### Objeción 1 — "Para APLV severa yo uso fórmula elemental, no hidrolizado"
**Respuesta:** "Y hace bien. En APLV severa con anafilaxia o FPIES grave, la primera línea es fórmula elemental — nuestra hidrolizada no es la indicación ahí, y no se la voy a plantear. Donde sí es primera línea es en APLV leve-moderada, que es el 80 a 90% de los casos que usted ve: proctocolitis, cólico persistente, eczema moderado. Ahí el 97,9% de péptidos por debajo de 1.000 Da da el margen de seguridad, con mejor palatabilidad y mejor costo-efectividad que una elemental."

### Objeción 2 — "Los hidrolizados saben tan mal que los bebés los rechazan"
**Respuesta:** "Es el principal motivo de fracaso terapéutico en APLV, y por eso trabajamos específicamente sobre eso. El mal sabor viene de los grupos sulfhídricos libres de la L-cisteína que quedan expuestos al fragmentar las proteínas. Nosotros convertimos la L-cisteína en L-cistina, formando un puente disulfuro que enmascara esos grupos. Ninguna otra hidrolizada del mercado lo hace. Le puedo dejar muestra para que lo compruebe usted mismo."

### Objeción 3 — "¿Por qué usan caseína si es más alergénica que el suero?"
**Respuesta:** "Es una pregunta muy pertinente y la respuesta es contraintuitiva. La caseína intacta sí es más alergénica, pero su estructura es desordenada, sin puentes disulfuro que la estabilicen — eso la hace mucho más fácil de hidrolizar completamente. Los hidrolizados de suero parten de α-lactoalbúmina y β-lactoglobulina, que son globulares y resistentes. Resultado: partiendo de caseína conseguimos péptidos más pequeños, 97,9% por debajo de 1.000 Da, y además cero β-lactoglobulina sin posibilidad de trazas."

### Objeción 4 — "¿Por qué GLA y no ARA? El ARA es esencial para el desarrollo cerebral"
**Respuesta:** "El ARA es esencial y el bebé lo obtiene igual, solo que por otra ruta. El GLA se elonga a DGLA y de ahí a ARA en hígado y tejido nervioso, así que el aporte sistémico está cubierto. La diferencia está en la piel: los queratinocitos atópicos tienen déficit de Δ6-desaturasa, así que el GLA no se convierte a ARA localmente. Y el ARA vía COX-2 genera PGE2 y vía 5-lipooxigenasa genera leucotrienos, que agravan el eczema. Con GLA obtenemos el ARA que el cerebro necesita sin cargar de sustrato proinflamatorio la piel del paciente atópico."

### Objeción 5 — "¿Cuánto tiempo debe estar con la fórmula?"
**Respuesta:** "La dieta de eliminación mínima es de 2 a 4 semanas para evaluar respuesta. El sangrado en heces suele ceder en 1 a 2 semanas, el resto de síntomas digestivos entre 2 y 4. La confirmación diagnóstica se hace con prueba de provocación oral supervisada, normalmente entre los 6 y 12 meses. Y vale recordar que la APLV se resuelve en cerca del 50% al año y más del 75% a los 3 años — es un tratamiento transitorio."

### Objeción 6 — "La madre está amamantando, ¿le doy la fórmula?"
**Respuesta:** "No, ahí la primera línea no es cambiar a fórmula. Es dieta de exclusión de proteína de leche de vaca en la madre, manteniendo la lactancia y suplementándola con calcio y vitamina D. La hidrolizada entra si esa medida falla, si la lactancia no es viable, o como complemento cuando la producción es insuficiente. No tiene sentido sustituir lactancia materna por fórmula cuando hay una alternativa que preserva la lactancia."

### Objeción 6 — "¿No es muy cara?"
**Respuesta:** "Es más cara que una fórmula estándar, sí, aunque considerablemente menos que una elemental de aminoácidos. La comparación relevante es esa: si logramos controlar una APLV leve-moderada con hidrolizada en lugar de escalar a elemental, la diferencia de costo es sustancial. Y el factor que más pesa es la adherencia: una fórmula rechazada por sabor termina en cambios repetidos, consultas adicionales y en algunos casos en escalada innecesaria a elemental."

| Parámetro | Valor |

### Por qué la proteína de arroz necesita suplementación de aminoácidos

La proteína de arroz es de origen vegetal y su perfil de aminoácidos es **incompleto**: es deficitaria en **lisina, treonina y triptófano**.

Por eso la fórmula los añade de forma libre, corrigiendo el aminoacidograma hasta hacerlo nutricionalmente completo para el lactante.

> Sin esta corrección, una fórmula de arroz no sería nutricionalmente adecuada como alimento único.

### La hidrólisis
La proteína de arroz se hidroliza para:
1. Reducir aún más su ya baja alergenicidad
2. Mejorar su digestibilidad
3. Facilitar la absorción de los aminoácidos

### Ventaja diferencial sobre las FEH de leche de vaca
Una FEH parte de proteína de leche de vaca hidrolizada — el antígeno está fragmentado, pero **presente**. En Arroz Hidrolizado no hay proteína de leche de vaca en absoluto: **el antígeno no existe**.

Esto la hace especialmente útil en:
- Pacientes que **no responden** a FEH
- Pacientes con **rechazo por sabor** de la FEH
- Familias con **preferencia por opciones vegetales**

## Nutribén® Sin Lactosa 1 y 2 — Ficha Técnica

**Indicación:** intolerancia a la lactosa congénita o transitoria, gastroenteritis aguda con déficit de lactasa, diarrea por antibioterapia, procesos diarreicos de diverso origen.
**Marco:** Regl. (UE) 2016/128 (FSMP)

### Composición

| Parámetro | Valor |
|---|---|
| **Lactosa** | **0%** |
| **Hidratos de carbono** | **100% maltodextrina** |
| Fracción proteica | Con α-lactoalbúmina ✅ |
| **Probiótico** | **L. rhamnosus** ✅ |
| **Prebióticos** | **NINGUNO** ⚠️ |
| Zinc | ✅ Enriquecido |
| DHA | ✅ |
| Aceite de palma | Ausente |

### Por qué 100% maltodextrina
- Se digiere por α-amilasas, independiente de la lactasa dañada
- Peso molecular alto (1.000–10.000 Da) → **baja carga osmótica luminal**
- Absorción eficiente sin sobrecargar el intestino inflamado

### ⚠️ La decisión de formulación clave: SIN prebióticos

Esta es la pregunta que un gastroenterólogo hará, y hay que tener la respuesta clara.

**Los GOS y FOS, que son beneficiosos en el resto de la línea, están deliberadamente ausentes aquí porque:**
1. Aumentan la **carga osmótica luminal** → arrastran agua al lumen
2. **Aceleran el tránsito** colónico
3. Su fermentación genera **gas y ácidos orgánicos**

En un intestino con diarrea aguda, esos tres efectos **prolongarían el episodio**.

> **La ausencia de prebióticos no es una carencia del producto: es una decisión terapéutica correcta.**

Es el probiótico con mejor evidencia en diarrea aguda infantil.

## Cuándo Usar Fórmula Sin Lactosa

### Evidencia — Metaanálisis Cochrane
Fórmulas sin lactosa en diarrea aguda infantil:
- **Reducción de la duración de la diarrea: ~18 horas** (16 ensayos)
- **Reducción del fracaso terapéutico: aproximadamente a la mitad** (18 ensayos)

### Posicionamiento ESPGHAN / OMS
La dieta sin lactosa se considera en:
- Niños con **diarrea que persiste más de 7 días**
- **Hospitalizados por gastroenteritis aguda severa**

> **No es indicación rutinaria en toda diarrea aguda.** En un episodio leve y autolimitado, el manejo estándar con SRO y realimentación precoz es suficiente.

### La secuencia fisiopatológica que justifica la indicación
1. Infección viral (rotavirus, norovirus) destruye enterocitos apicales
2. Se pierde la **lactasa del borde en cepillo** (localizada en el ápice de las vellosidades)
3. La lactosa no digerida genera **carga osmótica** → arrastre de agua al lumen
4. Fermentación colónica → gas y ácidos orgánicos → más agua
5. **Diarrea osmótica que perpetúa el cuadro**

**Recuperación de la lactasa:** 2–4 semanas. Es **transitoria**.

### Tipos de intolerancia a la lactosa

| Tipo | Frecuencia | Curso |
|---|---|---|
| Congénita (alactasia) | Muy rara | Permanente |
| **Secundaria (post-infecciosa)** | **Común** | **Transitoria (2–4 semanas)** |
| Primaria del adulto | Muy frecuente | Progresiva, inicio tras los 5 años |

### Los pilares que NO sustituye
La fórmula sin lactosa es coadyuvante. **No sustituye:**
1. **Rehidratación oral con SRO de baja osmolaridad** — la intervención que salva vidas
2. **Realimentación precoz (4–6 h)** — el ayuno prolongado atrofia las vellosidades
3. **Mantener la lactancia materna** — nunca se suspende
4. **Zinc 10–20 mg/día × 10–14 días** (OMS)

> **Distinción crítica:** intolerancia a la lactosa ≠ APLV. Déficit enzimático vs. reacción inmunológica. Una fórmula sin lactosa NO trata la APLV.

## Nutribén® Soja — Ficha Técnica

**Indicación:** **galactosemia**, dietas vegetarianas estrictas, intolerancia a la lactosa, diarrea, APLV como alternativa en mayores de 6 meses.

### Composición

| Parámetro | Valor |
|---|---|
| Fuente proteica | **100% proteína vegetal de soja** |
| Lactosa | 0% — 100% maltodextrina |
| Aminoácidos añadidos | **L-metionina, L-carnitina, L-triptófano, taurina** |
| **Carga renal** | **111 mOsm/L** |
| Osmolaridad | 126 mOsm/L |
| Vitamina D | ✅ Enriquecida |
| Aceite de palma | Ausente |

### La indicación única: GALACTOSEMIA

La galactosemia es un **error congénito del metabolismo** por déficit de galactosa-1-fosfato uridiltransferasa (GALT). El paciente no puede metabolizar la galactosa.

**Consecuencia crítica:** la lactosa es un disacárido de **glucosa + galactosa**. Por tanto:
- ❌ Ninguna fórmula láctea, ni siquiera una **extensamente hidrolizada**, es apta — todas contienen galactosa
- ❌ La lactancia materna está **contraindicada**
- ✅ Se requiere una fórmula **100% libre de derivados lácteos**

> **Nutribén® Soja es la única opción del portafolio para galactosemia.** Es su indicación exclusiva e insustituible.

### Por qué la suplementación de aminoácidos
La proteína de soja es deficitaria en **metionina**. Además se añaden L-carnitina (transporte de ácidos grasos a la mitocondria), L-triptófano y taurina, que son escasos en fuentes vegetales.

### Limitaciones que debes conocer

**1. ESPGHAN desaconseja soja en APLV en menores de 6 meses**
Por reactividad cruzada soja–PLV en el **10–14%** de los pacientes con APLV.

**2. Fitatos**
Interfieren con la absorción de hierro, zinc y calcio. Por eso la fórmula está enriquecida en vitamina D para facilitar la absorción de calcio y fósforo.

**3. Isoflavonas**
Fitoestrógenos presentes en la soja. La evidencia de efecto clínico adverso es limitada, pero es motivo de cautela en lactantes pequeños.

### Posicionamiento honesto
- **Galactosemia** → indicación absoluta e insustituible ✅
- **Dieta vegetariana estricta familiar** → indicación clara ✅
- **APLV en <6 meses** → preferir Hidrolizada o Arroz Hidrolizado ⚠️
- **APLV en >6 meses** → alternativa aceptable

## Nutribén® RN Bajo Peso — Ficha Técnica

**Indicación:** recién nacidos pretérmino y/o de bajo peso al nacer.
**Marco:** Regl. Delegado (UE) 2016/128 (FSMP)

### Composición diferencial

| Parámetro | RN Bajo Peso |
|---|---|
| Perfil proteico | **α-lactoalbúmina** + AA condicionalmente esenciales |
| **L-Triptófano** | ✅ Reforzado |
| **L-Glutámico** | ✅ Añadido |
| **L-Arginina** | ✅ Añadida |
| **DHA : ARA** | **1 : 1** |
| Densidad calórica | ↑ Aumentada |
| Minerales (Ca, P) | ↑ Enriquecidos |
| Aceite de palma | Ausente |

### Por qué el prematuro es un paciente distinto

**Requerimiento proteico:**

| Población | g/kg/día |
|---|---|
| Término sano | 1,5–2,5 |
| Prematuro 1000–1800 g | **3,5–4,0** |
| Prematuro <1000 g | **4,0–4,5** |

El prematuro necesita casi el **doble** de proteína por kg para recuperar el crecimiento intrauterino perdido.

> **Punto clave que un neonatólogo evaluará:** no se puede usar α-lactoalbúmina como fuente proteica **única** en un prematuro. Para alcanzar 4 g/kg/día la carga renal superaría los 200 mOsm/L — peligroso para un riñón que concentra máximo ~700 mOsm/kg. La α-LA aporta **calidad**; el volumen proteico total cubre la **cantidad**.

### Los tres aminoácidos condicionalmente esenciales

**1. L-Triptófano**
→ 5-HTP → **Serotonina** (motilidad GI, saciedad, confort) → **Melatonina** (ciclo circadiano, desarrollo cerebral).
El prematuro no sintetiza suficiente 5-HTP; el triptófano es limitante.

**2. L-Glutámico (glutamato)**
Es el **principal sustrato energético del enterocito neonatal** — preferido incluso sobre la glucosa en la mucosa intestinal.
Crítico para la maduración de las vellosidades y la prevención de **enterocolitis necrotizante (ECN)**.

**3. L-Arginina**
- Sustrato para la síntesis de **óxido nítrico** (vasodilatación, perfusión intestinal, función inmune)
- Interviene en el **ciclo de la urea** — el hígado inmaduro del prematuro tiene capacidad limitada de detoxificación del amoniaco

### DHA : ARA 1:1
La acreción de DHA cerebral ocurre principalmente en el **tercer trimestre gestacional** (~50–70 mg DHA/kg/día). El prematuro **pierde esa ventana**.

Cumple la proporción exigida por el Regl. (UE) 2016/128 para FSMP de prematuros.

    { id:"u8l2", title:"Evidencia ESPGHAN y Manejo Post-Alta", duration:"9 min", content:`
## Alimentación del Prematuro Tras el Alta Hospitalaria

**Referencia:** ESPGHAN Committee on Nutrition. *Feeding Preterm Infants After Hospital Discharge*. J Pediatr Gastroenterol Nutr 2006;42:596–603.

### El problema del alta
Al alta, la mayoría de prematuros presenta **déficit acumulado de nutrientes** — lo que se denomina *extrauterine growth restriction* (EUGR). Han crecido, pero por debajo de la curva intrauterina que les correspondía.

**El período post-alta es una ventana de recuperación (*catch-up growth*)**, no un período de mantenimiento.

### Recomendaciones ESPGHAN
- Fórmulas post-alta **enriquecidas en proteína de alta calidad**, energía, minerales y micronutrientes
- Mantener hasta alcanzar percentiles adecuados de peso y talla
- **La lactancia materna es de elección**, con fortificante si es necesario
- Vigilar **mineralización ósea** — la osteopenia del prematuro es frecuente

### El equilibrio delicado del catch-up
- **Insuficiente** → déficit de crecimiento, con impacto en el neurodesarrollo
- **Excesivo o demasiado rápido** → riesgo metabólico a largo plazo (la programación metabólica también aplica al prematuro)

> El objetivo no es crecer lo más rápido posible, sino crecer **adecuadamente** con nutrientes de alta calidad biológica.

### Por qué la calidad proteica importa más en el prematuro
En un prematuro con requerimiento de 4 g/kg/día, la diferencia entre proteína de alta y baja calidad biológica se **amplifica**:
- Mejor aminoacidograma = menos proteína desperdiciada en catabolismo
- Menos catabolismo = **menor carga renal** para la misma ganancia de nitrógeno
- La α-lactoalbúmina, con su alta digestibilidad y perfil de AA, permite una utilización nitrogenada más eficiente

### La osteopenia del prematuro
El 80% de la acreción mineral ósea fetal ocurre en el **tercer trimestre**. El prematuro nace con reservas de calcio y fósforo muy reducidas.

**Doble relevancia de la ausencia de aceite de palma:** los jabones cálcicos reducen hasta un 30% la absorción de calcio. En un paciente con osteopenia establecida, esa pérdida es clínicamente significativa.

*(Béghìn L et al. Clinical Nutrition 2019 — mayor contenido mineral óseo con sn-2 palmitato)*
` },

## Objeciones

### Objeción 1 — "¿Qué tiene de especial frente a una fórmula de inicio estándar?"
**Respuesta:** "Tres cosas. La primera es el perfil de aminoácidos condicionalmente esenciales: triptófano, que el prematuro no sintetiza en cantidad suficiente y que es precursor de serotonina y melatonina; L-glutámico, que es el sustrato energético principal del enterocito neonatal y factor de maduración intestinal; y L-arginina, para óxido nítrico y ciclo de la urea, que en un hígado inmaduro importa. La segunda es DHA-ARA 1:1 conforme al Reglamento 2016/128, porque el prematuro perdió la acreción del tercer trimestre. Y la tercera es la ausencia de aceite de palma, que en un paciente con osteopenia no es un detalle."

### Objeción 2 — "Si la α-lactoalbúmina es tan buena, ¿por qué no usarla como fuente proteica única en el prematuro?"
**Respuesta:** "Porque no alcanzaría. Un prematuro de 1.200 gramos necesita entre 3,5 y 4 gramos por kilo al día. Para llegar ahí solo con α-lactoalbúmina, la carga renal superaría los 200 mOsm/L, y ese riñón concentra como máximo alrededor de 700 mOsm/kg. La α-lactoalbúmina aporta calidad — mejor aminoacidograma, mejor digestibilidad, menos catabolismo — pero la cantidad la tiene que cubrir el volumen proteico total. Es una mezcla, no una fuente única."

### Objeción 3 — "El prematuro debe recibir leche materna fortificada, no fórmula"
**Respuesta:** "Completamente de acuerdo, y así lo dice ESPGHAN: la leche materna es de elección, con fortificante cuando se requiere. Esta fórmula tiene su lugar cuando la lactancia no es posible, cuando es insuficiente y hay que complementar, o tras el alta si se suspendió el fortificante. No sustituye leche materna donde la hay."

### Objeción 4 — "¿Hasta cuándo la mantengo tras el alta?"
**Respuesta:** "ESPGHAN recomienda mantenerla hasta alcanzar percentiles adecuados de peso y talla, con seguimiento antropométrico. El equilibrio es delicado: si el catch-up es insuficiente hay impacto en neurodesarrollo, y si es excesivo o demasiado rápido aumenta el riesgo metabólico a largo plazo. La programación metabólica también aplica al prematuro."

### Objeción 5 — "¿Por qué importa tanto el aceite de palma en un prematuro?"
**Respuesta:** "Por la osteopenia. El 80% de la acreción mineral ósea fetal ocurre en el tercer trimestre, así que el prematuro nace con reservas de calcio y fósforo muy reducidas. Los jabones cálcicos que forma el palmitato en posición sn-1 y sn-3 reducen hasta un 30% la absorción de calcio. En un paciente con osteopenia establecida esa pérdida es clínicamente relevante. El RCT de Béghìn en Clinical Nutrition 2019 documentó mayor contenido mineral óseo con sn-2 palmitato."

// ---------- utilidades ----------
function esc(t){ return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function $(id){ return document.getElementById(id); }
function shuffle(a){ var r=a.slice(); for(var i=r.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=r[i]; r[i]=r[j]; r[j]=t; } return r; }

// Markdown mínimo (el contenido ya trae &lt; / &gt; escapados)
function md(src){
  var out=[], lines=src.split("\n"), i=0, tbl=null;
  function closeTbl(){ if(tbl){ out.push(tbl+"</tbody></table>"); tbl=null; } }
  for(i=0;i<lines.length;i++){
    var L=lines[i];
    if(/^\s*\|/.test(L)){
      var cells=L.replace(/^\s*\|/,"").replace(/\|\s*$/,"").split("|").map(function(c){return c.trim();});
      if(/^[\s\|:\-]+$/.test(L)) continue;
      if(!tbl){ tbl="<table><thead><tr>"+cells.map(function(c){return "<th>"+inl(c)+"</th>";}).join("")+"</tr></thead><tbody>"; }
      else { tbl+="<tr>"+cells.map(function(c){return "<td>"+inl(c)+"</td>";}).join("")+"</tr>"; }
      continue;
    }
    closeTbl();
    if(/^###\s/.test(L)) out.push("<h4>"+inl(L.slice(4))+"</h4>");
    else if(/^##\s/.test(L)) out.push("<h3>"+inl(L.slice(3))+"</h3>");
    else if(/^>\s?/.test(L)) out.push("<blockquote>"+inl(L.replace(/^>\s?/,""))+"</blockquote>");
    else if(/^---\s*$/.test(L)) out.push("<hr>");
    else if(/^[\-\*]\s/.test(L)) out.push("<li>"+inl(L.slice(2))+"</li>");
    else if(/^\d+\.\s/.test(L)) out.push("<li>"+inl(L.replace(/^\d+\.\s/,""))+"</li>");
    else if(L.trim()==="") out.push("");
    else out.push("<p>"+inl(L)+"</p>");
  }
  closeTbl();
  var h=out.join("\n");
  h=h.replace(/(<li>[\s\S]*?<\/li>)(?!\s*<li>)/g, function(m){ return "<ul>"+m+"</ul>"; });
  return h.replace(/<\/ul>\s*<ul>/g,"");
}
function inl(t){
  return t.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")
          .replace(/(^|[^\*])\*([^\*]+?)\*/g,"$1<em>$2</em>")
          .replace(/`(.+?)`/g,"<code>$1</code>");
}

// ---------- lógica de desbloqueo ----------
function troncos(){ return CURRICULUM.filter(function(m){return m.tipo==="tronco";}); }
function unidades(){ return CURRICULUM.filter(function(m){return m.tipo==="unidad";}); }
function aprobado(id){ return (S.scores[id]||0) >= CFG.minimo; }

function desbloqueado(m){
  var T=troncos(), idx=T.map(function(x){return x.id;}).indexOf(m.id);
  if(idx===0) return true;
  if(idx>0) return aprobado(T[idx-1].id);            // troncos secuenciales
  return T.every(function(t){ return aprobado(t.id); }); // unidades: todos los troncos
}
function examDisponible(){
  return troncos().every(function(t){return aprobado(t.id);}) &&
         unidades().every(function(u){return aprobado(u.id);});
}
function motivoBloqueo(m){
  var T=troncos(), idx=T.map(function(x){return x.id;}).indexOf(m.id);
  if(idx>0) return "Requiere aprobar "+T[idx-1].codigo+" con "+CFG.minimo+"%";
  return "Requiere aprobar los 3 troncos (T1, T2, T3)";
}

// ---------- quiz ----------
function iniciarQuiz(m, esExamen){
  var n = esExamen ? EXAMEN_FINAL.nPreguntas : CFG.nPreg;
  var pool = shuffle(m.bank).slice(0, Math.min(n, m.bank.length));
  var preg = pool.map(function(p){
    var pares = p.opts.map(function(o,i){ return {t:o, ok:(i===p.ok)}; });
    pares = shuffle(pares);
    var okIdx = 0;
    for(var k=0;k<pares.length;k++){ if(pares[k].ok) okIdx=k; }
    return { q:p.q, opts:pares.map(function(x){return x.t;}), ok:okIdx, exp:p.exp };
  });
  view.quiz = { mod:m, esExamen:!!esExamen, preg:preg, i:0, sel:null, mostrado:false, correctas:0 };
  render();
}

function responder(i){
  var Q=view.quiz; if(Q.mostrado) return;
  Q.sel=i; Q.mostrado=true;
  if(i===Q.preg[Q.i].ok) Q.correctas++;
  render();
}
function siguiente(){
  var Q=view.quiz;
  if(Q.i < Q.preg.length-1){ Q.i++; Q.sel=null; Q.mostrado=false; render(); return; }
  var pct = Math.round(Q.correctas/Q.preg.length*100);
  var modId = Q.esExamen ? "exam" : Q.mod.id;
  S.intentos[modId] = (S.intentos[modId]||0) + 1;
  var aprobado_ = pct >= (Q.esExamen ? EXAMEN_FINAL.minimo : CFG.minimo);
  if(Q.esExamen){ S.examScore = Math.max(S.examScore||0, pct); }
  else { S.scores[Q.mod.id] = Math.max(S.scores[Q.mod.id]||0, pct); }
  Q.final = pct; save(); render();

  // Registro histórico inmutable — se envía sin importar si aprobó o no.
  registrarIntentoRemoto({
    device_id: deviceId(),
    nombre: S.user,
    pais: S.pais,
    modulo_id: modId,
    modulo_codigo: Q.esExamen ? "CERT" : Q.mod.codigo,
    modulo_titulo: Q.esExamen ? EXAMEN_FINAL.title : Q.mod.title,
    es_examen: !!Q.esExamen,
    correctas: Q.correctas,
    total: Q.preg.length,
    porcentaje: pct,
    aprobado: aprobado_,
    intento_numero: S.intentos[modId]
  });
}

// ---------- render ----------
function render(){
  var app=$("app");
  if(view.admin){ app.innerHTML=vAdmin(); return; }
  if(!S.user){ app.innerHTML=vLogin(); return; }
  if(view.quiz){ app.innerHTML = view.quiz.final!==undefined ? vResultado() : vQuiz(); return; }
  if(view.mod){ app.innerHTML=vModulo(); return; }
  if(view.reporte){ app.innerHTML=vReporte(); return; }
  app.innerHTML=vHome();
}

// ---------- panel de administrador (lectura vía RPC protegida por passcode) ----------
var ADMIN = { pass:"", filas:null, error:null, cargando:false, fVM:"", fModulo:"", fSoloReprobados:false };

function vAdmin(){
  if(!ADMIN.filas){
    var h='<div class="login"><div class="lcard">'+
      '<div class="logo">Nutribén<span>®</span></div>'+
      '<h1>Panel del Gerente</h1>'+
      '<p class="sub">Registro histórico de intentos — solo lectura, protegido por contraseña.</p>'+
      '<label>Contraseña</label><input id="inPass" type="password" placeholder="••••••••" onkeydown="if(event.key==\'Enter\')cargarAdmin()">'+
      (ADMIN.error? '<p style="color:#e26a6a;font-size:13px;margin-top:8px;font-weight:600">'+esc(ADMIN.error)+'</p>' : '')+
      '<button class="btn primary" onclick="cargarAdmin()">'+(ADMIN.cargando?"Cargando…":"Entrar")+'</button>'+
      '<div class="loadrow"><span class="link" onclick="view.admin=false;render()">← Volver a la Academia</span></div>'+
      '</div></div>';
    return h;
  }
  var filas = ADMIN.filas.slice();
  if(ADMIN.fVM) filas = filas.filter(function(r){ return r.nombre.toLowerCase().indexOf(ADMIN.fVM.toLowerCase())>-1; });
  if(ADMIN.fModulo) filas = filas.filter(function(r){ return r.modulo_codigo===ADMIN.fModulo; });
  if(ADMIN.fSoloReprobados) filas = filas.filter(function(r){ return !r.aprobado; });

  // agregación: mejor nota por VM+módulo
  var mejor = {};
  ADMIN.filas.forEach(function(r){
    var k=r.nombre+"|"+r.modulo_codigo;
    if(!mejor[k] || r.porcentaje>mejor[k].porcentaje) mejor[k]=r;
  });
  var vms = {}; ADMIN.filas.forEach(function(r){ vms[r.nombre]=r.pais; });
  var codigos = Array.from(new Set(ADMIN.filas.map(function(r){return r.modulo_codigo;}))).sort();

  var h='<div class="top"><div class="tl"><span class="logo sm">Nutribén<span>®</span></span><span class="who">Panel del Gerente</span></div>'+
    '<div class="tr"><button class="mini" onclick="ADMIN.filas=null;view.admin=false;render()">Salir</button></div></div>';
  h+='<div class="wrap">';

  h+='<h2 class="sec">Resumen por visitador <span class="hint">'+Object.keys(vms).length+' visitadores · '+ADMIN.filas.length+' intentos registrados</span></h2>';
  h+='<div class="grid">';
  Object.keys(vms).sort().forEach(function(nombre){
    var suyos = ADMIN.filas.filter(function(r){return r.nombre===nombre;});
    var aprobados = Object.keys(mejor).filter(function(k){return k.indexOf(nombre+"|")===0 && mejor[k].aprobado;}).length;
    var reprobExam = suyos.filter(function(r){return r.es_examen && !r.aprobado;}).length;
    var certificado = Object.keys(mejor).some(function(k){return k===nombre+"|CERT" && mejor[k].aprobado;});
    h+='<div class="card'+(certificado?" done":"")+'" style="--c:'+(certificado?"#2eb87a":"#6C8CC7")+'" onclick="ADMIN.fVM='+JSON.stringify(nombre)+';render()">'+
       '<div class="chead"><span class="cic">'+(certificado?"🏆":"👤")+'</span><span class="cod">'+esc(vms[nombre])+'</span></div>'+
       '<h3>'+esc(nombre)+'</h3><p>'+aprobados+' módulos aprobados · '+suyos.length+' intentos totales</p>'+
       '<div class="cfoot">'+(certificado?"Certificado":(reprobExam?reprobExam+" intento(s) fallido(s) en examen":"En progreso"))+'</div></div>';
  });
  h+='</div>';

  h+='<h2 class="sec">Historial de intentos <span class="hint">orden cronológico, más reciente primero</span></h2>';
  h+='<div class="navrow" style="margin-bottom:14px">'+
     '<input placeholder="Filtrar por VM…" value="'+esc(ADMIN.fVM)+'" oninput="ADMIN.fVM=this.value;render()" style="padding:9px 12px;border:1.5px solid var(--line);border-radius:9px;font-size:13px;font-family:inherit">'+
     '<select onchange="ADMIN.fModulo=this.value;render()" style="padding:9px 12px;border:1.5px solid var(--line);border-radius:9px;font-size:13px;font-family:inherit">'+
       '<option value="">Todos los módulos</option>'+codigos.map(function(c){return '<option value="'+c+'"'+(ADMIN.fModulo===c?" selected":"")+'>'+c+'</option>';}).join("")+
     '</select>'+
     '<label style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mut)"><input type="checkbox" '+(ADMIN.fSoloReprobados?"checked":"")+' onchange="ADMIN.fSoloReprobados=this.checked;render()"> Solo reprobados</label>'+
     (ADMIN.fVM||ADMIN.fModulo||ADMIN.fSoloReprobados ? '<button class="mini" onclick="ADMIN.fVM=\'\';ADMIN.fModulo=\'\';ADMIN.fSoloReprobados=false;render()">Limpiar filtros</button>' : '')+
     '</div>';

  h+='<table class="rt"><thead><tr><th>Fecha y hora</th><th>Visitador</th><th>País</th><th>Módulo</th><th>Intento #</th><th>Resultado</th><th>Estado</th></tr></thead><tbody>';
  h+=filas.map(function(r){
    var f=new Date(r.created_at);
    return '<tr><td>'+f.toLocaleString("es-HN")+'</td><td>'+esc(r.nombre)+'</td><td>'+esc(r.pais)+'</td>'+
      '<td>'+esc(r.modulo_codigo)+' — '+esc(r.modulo_titulo)+'</td><td>'+r.intento_numero+'</td>'+
      '<td>'+r.correctas+'/'+r.total+' ('+r.porcentaje+'%)</td>'+
      '<td>'+(r.aprobado?'<span class="ok">Aprobado</span>':'<span class="pend">No aprobado</span>')+'</td></tr>';
  }).join("");
  h+='</tbody></table>';
  if(filas.length===0) h+='<p style="text-align:center;color:var(--mut);padding:30px;font-size:13px">Sin registros para este filtro.</p>';

  h+='</div>';
  return h;
}

function cargarAdmin(){
  var pass = $("inPass") ? $("inPass").value : "";
  ADMIN.cargando=true; ADMIN.error=null; render();
  fetch(SUPA_URL+"/rest/v1/rpc/reporte_academia", {
    method:"POST",
    headers:{ "Content-Type":"application/json", "apikey":SUPA_KEY, "Authorization":"Bearer "+SUPA_KEY },
    body: JSON.stringify({ passcode: pass })
  }).then(function(r){
    if(!r.ok) throw new Error("auth");
    return r.json();
  }).then(function(data){
    ADMIN.cargando=false; ADMIN.filas = data;
    if(!data.length){ ADMIN.filas=[]; }
    render();
  }).catch(function(){
    ADMIN.cargando=false; ADMIN.error="Contraseña incorrecta o sin conexión."; render();
  });
}

function vLogin(){
  return '<div class="login"><div class="lcard">'+
    '<div class="logo">Nutribén<span>®</span></div>'+
    '<h1>Academia Científica</h1>'+
    '<p class="sub">Programa de formación para visitadores médicos · Casa Ferne, S.A.</p>'+
    '<label>Nombre completo</label><input id="inNombre" type="text" placeholder="Ej. Ricardo Flores">'+
    '<label>País</label><select id="inPais"><option>Honduras</option><option>El Salvador</option><option>Nicaragua</option><option>Costa Rica</option><option>Panamá</option><option>Guatemala</option></select>'+
    '<button class="btn primary" onclick="entrar()">Comenzar formación</button>'+
    '<div class="loadrow"><label class="link" for="fileIn">📂 Cargar progreso guardado</label>'+
    '<input id="fileIn" type="file" accept=".json" style="display:none" onchange="importar(event)"></div>'+
