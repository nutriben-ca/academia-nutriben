}
function entrar(){
  var n=$("inNombre").value.trim();
  if(!n){ alert("Ingrese su nombre."); return; }
  S.user=n; S.pais=$("inPais").value; save(); render();
}

function barra(){
  var tot=CURRICULUM.length, ap=CURRICULUM.filter(function(m){return aprobado(m.id);}).length;
  return '<div class="top"><div class="tl"><span class="logo sm">Nutribén<span>®</span></span>'+
    '<span class="who">'+esc(S.user)+' · '+esc(S.pais)+'</span></div>'+
    '<div class="tr"><span class="prog">'+ap+'/'+tot+' módulos</span>'+
    '<button class="mini" onclick="exportar()">💾 Guardar</button>'+
    '<button class="mini" onclick="view.reporte=true;render()">📊 Reporte</button></div></div>';
}

function tarjeta(m){
  var ok=aprobado(m.id), unl=desbloqueado(m), sc=S.scores[m.id];
  var cls = ok?"card done":(unl?"card":"card lock");
  var badge = ok?'<span class="badge ok">✓ '+sc+'%</span>' : (unl?(sc!==undefined?'<span class="badge try">'+sc+'%</span>':'') : '<span class="badge lk">🔒</span>');
  var click = unl ? ' onclick="abrir(\''+m.id+'\')"' : '';
  var sub = unl ? m.description : motivoBloqueo(m);
  return '<div class="'+cls+'"'+click+' style="--c:'+m.color+'">'+
    '<div class="chead"><span class="cic">'+m.icon+'</span><span class="cod">'+m.codigo+'</span>'+badge+'</div>'+
    '<h3>'+esc(m.title)+'</h3><p>'+esc(sub)+'</p>'+
    '<div class="cfoot">'+m.lessons.length+' lecciones · '+m.bank.length+' preguntas en banco</div></div>';
}

function vHome(){
  var T=troncos(), U=unidades();
  var h=barra()+'<div class="wrap">';
  h+='<div class="hero"><h1>Academia Científica Nutribén®</h1><p>Arquitectura de dos capas: primero la ciencia común, después cada fórmula en profundidad. Cada evaluación toma '+CFG.nPreg+' preguntas al azar de su banco y mezcla el orden de las opciones — no se puede memorizar.</p></div>';

  h+='<h2 class="sec">Capa 1 — Troncos obligatorios <span class="hint">secuenciales · '+CFG.minimo+'% para avanzar</span></h2>';
  h+='<div class="grid">'+T.map(tarjeta).join("")+'</div>';

  var tOk = T.every(function(t){return aprobado(t.id);});
  h+='<h2 class="sec">Capa 2 — Unidades de producto <span class="hint">'+(tOk?"orden libre":"se desbloquean al aprobar los 3 troncos")+'</span></h2>';
  h+='<div class="grid">'+U.map(tarjeta).join("")+'</div>';

  var ed=examDisponible();
  h+='<h2 class="sec">Certificación final</h2>';
  h+='<div class="grid"><div class="'+(S.examScore>=EXAMEN_FINAL.minimo?"card done":(ed?"card":"card lock"))+'"'+(ed?' onclick="abrirExamen()"':'')+' style="--c:#0033A1">'+
    '<div class="chead"><span class="cic">🏆</span><span class="cod">CERT</span>'+
    (S.examScore!==null&&S.examScore!==undefined?'<span class="badge '+(S.examScore>=EXAMEN_FINAL.minimo?'ok':'try')+'">'+S.examScore+'%</span>':(ed?'':'<span class="badge lk">🔒</span>'))+'</div>'+
    '<h3>'+EXAMEN_FINAL.title+'</h3><p>'+esc(ed?EXAMEN_FINAL.description:"Requiere los 3 troncos y las 8 unidades aprobadas")+'</p>'+
    '<div class="cfoot">'+EXAMEN_FINAL.nPreguntas+' preguntas de '+EXAMEN_FINAL.bank.length+' · mínimo '+EXAMEN_FINAL.minimo+'%</div></div></div>';

  return h+'</div>';
}

function abrir(id){ view.mod=CURRICULUM.filter(function(m){return m.id===id;})[0]; view.lesson=0; render(); }
function abrirExamen(){ iniciarQuiz(EXAMEN_FINAL, true); }

function vModulo(){
  var m=view.mod, L=m.lessons[view.lesson];
  var h=barra()+'<div class="wrap">';
  h+='<button class="back" onclick="view.mod=null;render()">← Volver al programa</button>';
  h+='<div class="mhead" style="--c:'+m.color+'"><span class="cic big">'+m.icon+'</span><div><span class="cod">'+m.codigo+'</span><h1>'+esc(m.title)+'</h1></div></div>';
  h+='<div class="tabs">'+m.lessons.map(function(x,i){
    return '<button class="tab'+(i===view.lesson?' on':'')+'" onclick="view.lesson='+i+';render()">'+(i+1)+'. '+esc(x.title)+'</button>';
  }).join("")+'</div>';
  h+='<div class="lesson"><div class="ltop"><span class="dur">⏱ '+L.duration+'</span></div>'+md(L.content)+'</div>';

  h+='<div class="navrow">';
  if(view.lesson>0) h+='<button class="btn ghost" onclick="view.lesson--;render()">← Anterior</button>';
  if(view.lesson<m.lessons.length-1) h+='<button class="btn primary" onclick="view.lesson++;render()">Siguiente lección →</button>';
  else h+='<button class="btn primary" onclick="iniciarQuiz(view.mod,false)">📝 Evaluar esta unidad ('+CFG.nPreg+' preguntas)</button>';
  h+='</div>';
  return h+'</div>';
}

function vQuiz(){
  var Q=view.quiz, P=Q.preg[Q.i];
  var h=barra()+'<div class="wrap narrow">';
  h+='<div class="qtop"><span>'+esc(Q.mod.title)+'</span><span class="qn">Pregunta '+(Q.i+1)+' de '+Q.preg.length+'</span></div>';
  h+='<div class="pbar"><div style="width:'+((Q.i)/Q.preg.length*100)+'%"></div></div>';
  h+='<div class="qcard"><p class="qq">'+esc(P.q)+'</p><div class="opts">';
  for(var i=0;i<P.opts.length;i++){
    var c="opt";
    if(Q.mostrado){ if(i===P.ok) c+=" good"; else if(i===Q.sel) c+=" bad"; else c+=" dim"; }
    h+='<button class="'+c+'" onclick="responder('+i+')"><span class="ltr">'+"ABCD"[i]+'</span>'+esc(P.opts[i])+'</button>';
  }
  h+='</div>';
  if(Q.mostrado){
    h+='<div class="exp '+(Q.sel===P.ok?"ok":"no")+'"><strong>'+(Q.sel===P.ok?"✓ Correcto":"✗ Incorrecto")+'</strong><p>'+esc(P.exp)+'</p></div>';
    h+='<button class="btn primary wide" onclick="siguiente()">'+(Q.i<Q.preg.length-1?"Siguiente pregunta →":"Ver resultado")+'</button>';
  }
  h+='</div></div>';
  return h;
}

function vResultado(){
  var Q=view.quiz, pct=Q.final, min=Q.esExamen?EXAMEN_FINAL.minimo:CFG.minimo, pass=pct>=min;
  var h=barra()+'<div class="wrap narrow"><div class="res '+(pass?"pass":"fail")+'">';
  h+='<div class="pct">'+pct+'%</div><h2>'+(pass?(Q.esExamen?"🏆 Certificación aprobada":"✓ Unidad aprobada"):"Necesita repasar")+'</h2>';
  h+='<p>'+Q.correctas+' de '+Q.preg.length+' respuestas correctas · mínimo requerido '+min+'%</p>';
  if(!pass) h+='<p class="note">Las preguntas se seleccionan al azar del banco y el orden de las opciones cambia en cada intento. Repase el contenido y vuelva a intentarlo.</p>';
  h+='<div class="navrow center">';
  h+='<button class="btn ghost" onclick="view.quiz=null;render()">Volver al programa</button>';
  if(!pass) h+='<button class="btn primary" onclick="iniciarQuiz(view.quiz.mod,view.quiz.esExamen)">Reintentar</button>';
  else if(!Q.esExamen) h+='<button class="btn primary" onclick="view.quiz=null;view.mod=null;render()">Continuar →</button>';
  h+='</div></div></div>';
  return h;
}

function vReporte(){
  var T=troncos(), U=unidades();
  var todos=T.concat(U);
  var apr=todos.filter(function(m){return aprobado(m.id);});
  var prom = apr.length? Math.round(todos.reduce(function(a,m){return a+(S.scores[m.id]||0);},0)/todos.length) : 0;
  var cert = S.examScore>=EXAMEN_FINAL.minimo;

  var h=barra()+'<div class="wrap narrow">';
  h+='<button class="back noprint" onclick="view.reporte=false;render()">← Volver</button>';
  h+='<div class="report"><div class="rhead"><span class="logo">Nutribén<span>®</span></span>'+
    '<h1>Reporte de Formación Científica</h1>'+
    '<p>'+esc(S.user)+' · '+esc(S.pais)+' · '+new Date().toLocaleDateString("es-HN")+'</p></div>';

  h+='<h3>Capa 1 — Troncos</h3><table class="rt"><thead><tr><th>Cód.</th><th>Módulo</th><th>Nota</th><th>Estado</th></tr></thead><tbody>';
  h+=T.map(function(m){ var s=S.scores[m.id]; return '<tr><td>'+m.codigo+'</td><td>'+esc(m.title)+'</td><td>'+(s!==undefined?s+"%":"—")+'</td><td>'+(aprobado(m.id)?'<span class="ok">Aprobado</span>':'<span class="pend">Pendiente</span>')+'</td></tr>'; }).join("");
  h+='</tbody></table>';

  h+='<h3>Capa 2 — Unidades de producto</h3><table class="rt"><thead><tr><th>Cód.</th><th>Unidad</th><th>Nota</th><th>Estado</th></tr></thead><tbody>';
  h+=U.map(function(m){ var s=S.scores[m.id]; return '<tr><td>'+m.codigo+'</td><td>'+esc(m.title)+'</td><td>'+(s!==undefined?s+"%":"—")+'</td><td>'+(aprobado(m.id)?'<span class="ok">Aprobado</span>':'<span class="pend">Pendiente</span>')+'</td></tr>'; }).join("");
  h+='</tbody></table>';

  h+='<div class="sum"><div><span>Módulos aprobados</span><strong>'+apr.length+' / '+todos.length+'</strong></div>'+
     '<div><span>Promedio general</span><strong>'+prom+'%</strong></div>'+
     '<div><span>Examen de certificación</span><strong>'+(S.examScore!==null&&S.examScore!==undefined?S.examScore+"%":"—")+'</strong></div></div>';

  h+='<div class="verd '+(cert?"y":"n")+'">'+(cert
     ? '🏆 <strong>VISITADOR CERTIFICADO</strong><br>Ha completado los 3 troncos, las 8 unidades de producto y el examen de certificación de casos cruzados.'
     : 'Formación en curso. Complete todos los módulos y el examen de certificación con al menos '+EXAMEN_FINAL.minimo+'% para obtener la certificación.')+'</div>';

  h+='<p class="foot">Casa Ferne, S.A. · Distribuidor exclusivo Nutribén® Centroamérica · Alter Farmacia S.A., Madrid</p>';
  h+='</div><button class="btn primary wide noprint" onclick="window.print()">🖨 Imprimir / Guardar PDF</button></div>';
  return h;
}
